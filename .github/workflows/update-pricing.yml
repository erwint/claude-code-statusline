name: Update pricing

# Anthropic publishes no pricing API, so pricing.json is regenerated from the
# official pricing docs (cross-checked against LiteLLM's price list) and
# committed. Installed statuslines pick the change up within 24h via the
# pricing fetch in internal/cost.
#
# Price changes are appended as dated periods, never applied retroactively, so
# how often this runs sets how precisely an unannounced change is dated — hence
# daily rather than weekly. Announced changes carry their real start date and
# are unaffected either way.
on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Regenerate pricing.json
        run: go run ./scripts/updatepricing

      - name: Verify it still parses
        run: go test ./internal/cost/... ./scripts/...

      - name: Commit changes
        run: |
          if git diff --quiet -- pricing.json; then
            echo "No pricing changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pricing.json
          git commit -m "Update model pricing from Anthropic docs

          Regenerated by scripts/updatepricing from the published pricing
          table, so cost estimates track rate changes and new models without
          a manual edit."
          git push
